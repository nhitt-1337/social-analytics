spring:
  application:
    name: social-analytics

  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/social_analytics?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Ho_Chi_Minh}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:root}

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: ${SHOW_SQL:true}
    properties:
      hibernate:
        format_sql: true

  # Social Login. Chỉ khai báo khi có biến môi trường: thiếu client-id thì Spring Boot không
  # tạo ClientRegistrationRepository, và SecurityConfig bỏ qua phần oauth2Login -> app vẫn chạy
  # bình thường, chỉ là trang /login không có nút nào.
  #
  # Redirect URI phải khai đúng y hệt bên trang quản trị ứng dụng của nhà cung cấp:
  #   http://localhost:8080/api/v1/login/oauth2/code/facebook
  #   http://localhost:8080/api/v1/login/oauth2/code/x
  # (có tiền tố /api/v1 vì server.servlet.context-path đặt như vậy)
  security:
    oauth2:
      client:
        registration:
          facebook:
            client-id: ${FACEBOOK_CLIENT_ID:#{null}}
            client-secret: ${FACEBOOK_CLIENT_SECRET:#{null}}
            client-name: Facebook
            scope: public_profile,email
          # Twitter nay là X; `x` là registrationId dựng sẵn của Spring Security
          # (authorize/token/user-info đều trỏ sang x.com).
          x:
            client-id: ${X_CLIENT_ID:#{null}}
            client-secret: ${X_CLIENT_SECRET:#{null}}
            client-name: X (Twitter)
            scope: users.read,tweet.read

  # Import Excel ở bước sau cần nhận file lớn hơn mặc định 1MB.
  servlet:
    multipart:
      max-file-size: ${MAX_FILE_SIZE:10MB}
      max-request-size: ${MAX_REQUEST_SIZE:10MB}

server:
  port: ${SERVER_PORT:8080}
  servlet:
    context-path: /api/v1

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method

logging:
  level:
    root: ${LOG_LEVEL_ROOT:INFO}
    demo.socialanalytics: ${LOG_LEVEL_APP:DEBUG}
    # Bật hai dòng dưới khi cần soi tham số bind vào câu SQL.
    org.hibernate.SQL: ${LOG_LEVEL_SQL:DEBUG}
    org.hibernate.orm.jdbc.bind: ${LOG_LEVEL_SQL_PARAM:WARN}
  pattern:
    console: "%d{HH:mm:ss.SSS} %-5level [%thread] %logger{36} - %msg%n"
  file:
    name: ${LOG_FILE:logs/social-analytics.log}
  logback:
    rollingpolicy:
      max-file-size: 10MB
      max-history: 7

# Job cập nhật chỉ số mạng xã hội.
social:
  crawl:
    enabled: ${CRAWL_ENABLED:true}
    # Khoảng cách giữa hai lần chạy, tính từ lúc lần trước KẾT THÚC (ISO-8601 duration).
    interval: ${CRAWL_INTERVAL:PT1H}
    # Đợi ứng dụng khởi động xong hẳn rồi mới chạy lần đầu.
    initial-delay: ${CRAWL_INITIAL_DELAY:PT1M}
    # Mỗi tài khoản là một tác vụ chạy song song.
    pool-size: ${CRAWL_POOL_SIZE:8}
    queue-capacity: ${CRAWL_QUEUE_CAPACITY:100}
    timeout-seconds: ${CRAWL_TIMEOUT_SECONDS:300}
    # Client giả lập; bỏ phần này khi nối API thật.
    mock:
      latency-ms: ${CRAWL_MOCK_LATENCY_MS:40}
      failure-rate: ${CRAWL_MOCK_FAILURE_RATE:0.1}
