spring:
  application:
    name: social-analytics

  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/social_analytics?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Ho_Chi_Minh}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:root}

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: ${SHOW_SQL:true}
    properties:
      hibernate:
        format_sql: true

  activemq:
    broker-url: ${MQ_URL:tcp://localhost:61616}
    user: ${MQ_USER:admin}
    password: ${MQ_PASSWORD:admin}
    # Không bật pool: cần thêm thư viện pooled-jms, thiếu nó thì không có ConnectionFactory

  jms:
    # Hàng đợi point-to-point: mỗi message chỉ một listener xử lý
    pub-sub-domain: false
    listener:
      # Listener ném lỗi thì message quay lại hàng đợi
      session:
        transacted: true

  # Mặc định của Spring chỉ 1MB
  servlet:
    multipart:
      max-file-size: ${MAX_FILE_SIZE:10MB}
      max-request-size: ${MAX_REQUEST_SIZE:10MB}

server:
  port: ${SERVER_PORT:8080}
  servlet:
    context-path: /api/v1

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method

logging:
  level:
    root: ${LOG_LEVEL_ROOT:INFO}
    demo.socialanalytics: ${LOG_LEVEL_APP:DEBUG}
    # Bật khi cần soi tham số bind vào SQL
    org.hibernate.SQL: ${LOG_LEVEL_SQL:DEBUG}
    org.hibernate.orm.jdbc.bind: ${LOG_LEVEL_SQL_PARAM:WARN}
  pattern:
    console: "%d{HH:mm:ss.SSS} %-5level [%thread] %logger{36} - %msg%n"
  file:
    name: ${LOG_FILE:logs/social-analytics.log}
  logback:
    rollingpolicy:
      max-file-size: 10MB
      max-history: 7

social:
  # Chỉ provider có đủ client id + secret mới được đăng ký.
  # Redirect URI: http://localhost:8080/api/v1/login/oauth2/code/{facebook|x}
  login:
    facebook:
      client-id: ${FACEBOOK_CLIENT_ID:}
      client-secret: ${FACEBOOK_CLIENT_SECRET:}
      # App Facebook mới chỉ có public_profile; xin email chưa bật sẽ bị Invalid Scopes
      scopes: ${FACEBOOK_SCOPES:public_profile,email}
    x:
      client-id: ${X_CLIENT_ID:}
      client-secret: ${X_CLIENT_SECRET:}
      scopes: ${X_SCOPES:users.read,tweet.read}

  # Dịch vụ tỷ giá SOAP. Mặc định trỏ vào endpoint của chính app để demo chạy được offline.
  exchange-rate:
    endpoint: ${EXCHANGE_RATE_ENDPOINT:http://localhost:8080/api/v1/soap}

  crawl:
    enabled: ${CRAWL_ENABLED:true}
    # Tính từ lúc lần trước kết thúc
    interval: ${CRAWL_INTERVAL:PT1H}

    initial-delay: ${CRAWL_INITIAL_DELAY:PT1M}
    # Mỗi tài khoản là một tác vụ song song
    pool-size: ${CRAWL_POOL_SIZE:8}
    queue-capacity: ${CRAWL_QUEUE_CAPACITY:100}
    timeout-seconds: ${CRAWL_TIMEOUT_SECONDS:300}
    # Client giả lập, bỏ khi nối API thật
    mock:
      latency-ms: ${CRAWL_MOCK_LATENCY_MS:40}
      failure-rate: ${CRAWL_MOCK_FAILURE_RATE:0.1}
