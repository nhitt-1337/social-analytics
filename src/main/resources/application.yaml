spring:
  application:
    name: social-analytics

  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/social_analytics?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Ho_Chi_Minh}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:root}

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: ${SHOW_SQL:true}
    properties:
      hibernate:
        format_sql: true

  # ActiveMQ: broker chạy bằng Docker Compose, xem README.
  activemq:
    broker-url: ${MQ_URL:tcp://localhost:61616}
    user: ${MQ_USER:admin}
    password: ${MQ_PASSWORD:admin}
    # Không bật pool: `spring.activemq.pool.enabled=true` cần thêm thư viện pooled-jms, thiếu nó
    # thì KHÔNG có ConnectionFactory nào được tạo và app chết lúc khởi động.
    # Mặc định Spring Boot đã bọc trong CachingConnectionFactory nên mỗi lần gửi không phải
    # mở kết nối mới — đủ cho nhu cầu ở đây.

  jms:
    # Hàng đợi (point-to-point), không phải topic: mỗi message chỉ MỘT listener xử lý.
    pub-sub-domain: false
    listener:
      # Phiên có transaction -> listener ném lỗi thì message quay lại hàng đợi và được giao lại.
      session:
        transacted: true

  # Import Excel ở bước sau cần nhận file lớn hơn mặc định 1MB.
  servlet:
    multipart:
      max-file-size: ${MAX_FILE_SIZE:10MB}
      max-request-size: ${MAX_REQUEST_SIZE:10MB}

server:
  port: ${SERVER_PORT:8080}
  servlet:
    context-path: /api/v1

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method

logging:
  level:
    root: ${LOG_LEVEL_ROOT:INFO}
    demo.socialanalytics: ${LOG_LEVEL_APP:DEBUG}
    # Bật hai dòng dưới khi cần soi tham số bind vào câu SQL.
    org.hibernate.SQL: ${LOG_LEVEL_SQL:DEBUG}
    org.hibernate.orm.jdbc.bind: ${LOG_LEVEL_SQL_PARAM:WARN}
  pattern:
    console: "%d{HH:mm:ss.SSS} %-5level [%thread] %logger{36} - %msg%n"
  file:
    name: ${LOG_FILE:logs/social-analytics.log}
  logback:
    rollingpolicy:
      max-file-size: 10MB
      max-history: 7

social:
  # Social Login. Provider nào có ĐỦ client id + secret mới được đăng ký; không có cái nào thì
  # trang /login hiện hướng dẫn cấu hình thay vì nút dẫn tới trang lỗi của nhà cung cấp.
  #
  # Redirect URI phải khai đúng y hệt bên trang quản trị ứng dụng của nhà cung cấp — chú ý tiền
  # tố /api/v1 do server.servlet.context-path:
  #   http://localhost:8080/api/v1/login/oauth2/code/facebook
  #   http://localhost:8080/api/v1/login/oauth2/code/x
  login:
    facebook:
      client-id: ${FACEBOOK_CLIENT_ID:}
      client-secret: ${FACEBOOK_CLIENT_SECRET:}
    x:
      client-id: ${X_CLIENT_ID:}
      client-secret: ${X_CLIENT_SECRET:}

  # Job cập nhật chỉ số mạng xã hội.
  crawl:
    enabled: ${CRAWL_ENABLED:true}
    # Khoảng cách giữa hai lần chạy, tính từ lúc lần trước KẾT THÚC (ISO-8601 duration).
    interval: ${CRAWL_INTERVAL:PT1H}
    # Đợi ứng dụng khởi động xong hẳn rồi mới chạy lần đầu.
    initial-delay: ${CRAWL_INITIAL_DELAY:PT1M}
    # Mỗi tài khoản là một tác vụ chạy song song.
    pool-size: ${CRAWL_POOL_SIZE:8}
    queue-capacity: ${CRAWL_QUEUE_CAPACITY:100}
    timeout-seconds: ${CRAWL_TIMEOUT_SECONDS:300}
    # Client giả lập; bỏ phần này khi nối API thật.
    mock:
      latency-ms: ${CRAWL_MOCK_LATENCY_MS:40}
      failure-rate: ${CRAWL_MOCK_FAILURE_RATE:0.1}
