# Test chạy trên H2 ở chế độ MySQL để không cần dựng MySQL thật.
spring:
  datasource:
    url: jdbc:h2:mem:social_analytics;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
    username: sa
    password: ""
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
logging:
  level:
    root: WARN
    demo.socialanalytics: INFO
