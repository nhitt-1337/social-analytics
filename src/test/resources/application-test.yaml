# Test chạy trên H2 ở chế độ MySQL để không cần dựng MySQL thật.
spring:
  datasource:
    url: jdbc:h2:mem:social_analytics;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
    username: sa
    password: ""
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false

  # Broker ActiveMQ NHÚNG, chạy ngay trong JVM của test: không cần dựng broker thật bằng Docker.
  #   broker.persistent=false -> không ghi message xuống đĩa, mỗi lần chạy bắt đầu với hàng đợi sạch
  #   broker.useJmx=false     -> tránh đụng tên MBean khi nhiều context test cùng chạy
  activemq:
    broker-url: vm://localhost?broker.persistent=false&broker.useJmx=false
logging:
  level:
    root: WARN
    demo.socialanalytics: INFO

# Test tự gọi job khi cần; để lịch tự chạy thì các test sẽ giẫm lên dữ liệu của nhau.
# Client giả lập chạy không độ trễ và không lỗi ngẫu nhiên để kết quả test xác định.
social:
  crawl:
    enabled: false
    mock:
      latency-ms: 0
      failure-rate: 0
